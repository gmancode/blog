<div class="pagination">
  {% if page.has_previous %}
    <a class="btn btn-ghost" href="?page={{ page.previous_page_number }}">← Назад</a>
  {% endif %}
  <span class="current">Страница {{ page.number }} из {{ page.paginator.num_pages }}</span>
  {% if page.has_next %}
    <a class="btn btn-ghost" href="?page={{ page.next_page_number }}">Вперёд →</a>
  {% endif %}
</div>
